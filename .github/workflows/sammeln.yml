# Startet den TrendZ-Sammler automatisch alle 3 Stunden
# und speichert die neuen Trends im Projekt.
name: Trends sammeln

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden (Zeit in UTC)
  workflow_dispatch:          # erlaubt auch einen Start per Knopfdruck

permissions:
  contents: write

concurrency:
  group: trends-sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Programme installieren
        run: pip install -r collector/requirements.txt

      - name: Trends sammeln
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector/collect.py

      - name: Neue Trends speichern
        run: |
          git config user.name "TrendZ-Sammler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Trends aktualisiert"
            git push
          fi
